name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon check
        run: moon check

      - name: moon test
        run: moon test

      - name: Build importable Mini Program showcase
        run: node scripts/mmp.cjs release

      - name: Headless smoke test of shipped artifact
        run: node scripts/smoke.js miniprogram/engine/moon-engine.js

  scaffold-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Scaffold a new project
        run: node scripts/new.cjs demo

      - name: Refresh mooncakes registry index (new project fetches framework)
        working-directory: demo
        run: moon update

      - name: mmp check & test in generated project
        working-directory: demo
        run: |
          node mmp.cjs check
          node mmp.cjs test

      - name: mmp build copies artifact into miniprogram shell
        working-directory: demo
        run: |
          node mmp.cjs build
          test -f miniprogram/engine/moon-engine.js
