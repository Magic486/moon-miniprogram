name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon check
        run: moon check

      - name: moon test
        run: moon test

      - name: Build engine (release, CJS)
        run: moon build --target js --release

      - name: Headless smoke test (simulated WeChat runtime)
        run: |
          mkdir -p examples/invoice-helper/miniprogram/engine
          cp _build/js/release/build/engine-export/engine-export.js \
             examples/invoice-helper/miniprogram/engine/moon-engine.js
          node scripts/smoke.js examples/invoice-helper/miniprogram/engine/moon-engine.js
